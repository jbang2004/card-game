name: Apply verified VFX R3 source
on:
  push:
    branches: [feat/3d-combat-vfx]
    paths: ['tools/vfx3/.r3-source.xz']
permissions:
  contents: write
concurrency:
  group: vfx-r3-source-transfer
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/3d-combat-vfx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply checksum-guarded source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import lzma, hashlib, json, subprocess
          payload = Path('tools/vfx3/.r3-source.xz')
          raw = lzma.decompress(payload.read_bytes())
          assert hashlib.sha256(raw).hexdigest() == 'f76b5ee3b551a82d763a8f0c4225a3b289cf08dddb938cfb0024cdf7ee6c4d63', 'Transport checksum mismatch'
          entries = json.loads(raw)
          expected = {'DELIVERY_VFX3_R3.md', 'docs/design/BATTLE_PRESENTATION_V2.md', 'src/effects.js', 'src/vfx3/renderer.js', 'src/vfx3/runtime.js', 'tests/vfx3-flow.test.cjs', 'tests/vfx3-refinement.test.cjs', 'tools/vfx3/lab.js', 'tools/vfx3/record_flow.py'}
          assert {e['path'] for e in entries} == expected
          pending = []
          for e in entries:
              p = Path(e['path'])
              assert not PurePosixPath(e['path']).is_absolute() and '..' not in p.parts
              old = p.read_bytes() if p.exists() else b''
              assert (hashlib.sha256(old).hexdigest() if old else None) == e['old'], 'Concurrent source change: ' + str(p)
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, end, text in reversed(e['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = text.splitlines(keepends=True)
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == e['new'], 'Output checksum mismatch: ' + str(p)
              pending.append((p, new))
          for p, data in pending:
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          subprocess.run(['git', 'rm', '--', str(payload)], check=True)
          print('Applied and verified', len(entries), 'source files; no rules, card data, secrets, or deployment changes.')
          PY
      - name: Build and run unit tests before publishing source
        run: |
          python3 build.py
          python3 tools/vfx3/export_demo.py
          node --test tests/*.test.cjs > /tmp/vfx-r3-tests.txt 2>&1
          tail -12 /tmp/vfx-r3-tests.txt
      - name: Commit to feature branch only, without force
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          branch='refs/heads/feat/3d-combat-vfx'
          actual=$(git ls-remote origin "$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD" || { echo 'Feature branch changed; refusing to overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(vfx3): independent flowing fire and articulated overhead cleave (R3)'
          git push origin "HEAD:$branch"
      - name: Publish test summary
        if: always()
        run: |
          test ! -f /tmp/vfx-r3-tests.txt || tail -15 /tmp/vfx-r3-tests.txt >> "$GITHUB_STEP_SUMMARY"
