name: One-shot verified skyfall source transfer
on:
  push:
    branches: [feat/skyfall-card-strike]
    paths: ['.github/r5-source/**', '.github/workflows/r5-skyfall-transfer.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'jbang2004/card-game' && github.ref == 'refs/heads/feat/skyfall-card-strike'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify baseline and restore exactly the locally tested sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9e5b06203fa020b479a7f174a811801c316e7dd5
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          expected = {'DELIVERY_SKYFALL_R5.md', 'config/build.json', 'docs/design/BATTLE_PRESENTATION_V2.md', 'docs/design/SKYFALL_CARD_STRIKE.md', 'docs/qa/vfx3-r5.json', 'src/effects.js', 'src/template.html', 'src/vfx3/runtime.js', 'src/vfx3/skyfall.js', 'tests/vfx3-flow.test.cjs', 'tests/vfx3-refinement.test.cjs', 'tests/vfx3-skyfall.test.cjs', 'tools/vfx3/lab.js', 'tools/vfx3/verify_skyfall.py'}
          encoded = ''.join(Path('.github/r5-source/part-%d.b64' % i).read_text() for i in range(2))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '826daa6a5939502f9b9553c2eaedeb676cf4b734629f23c7a9e5c45e1034ca3e', 'transport checksum mismatch'
          delta = json.loads(raw)
          assert set(delta) == expected, 'unexpected source paths'
          outputs = {}
          for name, change in delta.items():
              path = Path(name)
              before = path.read_bytes() if path.exists() else b''
              actual = hashlib.sha256(before).hexdigest() if path.exists() else None
              assert actual == change['before'], 'baseline changed: ' + name
              lines = before.decode('utf-8').splitlines(keepends=True)
              text = ''.join(part if isinstance(part, str) else ''.join(lines[part[0]:part[1]]) for part in change['parts'])
              content = text.encode('utf-8')
              assert hashlib.sha256(content).hexdigest() == change['after'], 'output checksum mismatch: ' + name
              outputs[path] = content
          for path, content in outputs.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          Path('/tmp/r5-paths.txt').write_text('\n'.join(sorted(expected)) + '\n')
          print('Verified and restored', len(outputs), 'files. Flame source, renderer and rule files unchanged.')
          PY
      - name: Build and run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py
          python3 tools/vfx3/export_demo.py
          node --test tests/*.test.cjs > /tmp/r5-node-tests.txt 2>&1 || { cat /tmp/r5-node-tests.txt; exit 1; }
          tail -12 /tmp/r5-node-tests.txt
      - name: Commit verified sources and remove temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do git add -- "$path"; done < /tmp/r5-paths.txt
          git rm -- .github/r5-source/part-0.b64 .github/r5-source/part-1.b64 .github/workflows/r5-skyfall-transfer.yml
          git diff --cached --stat
          git commit -m 'feat: vertical offscreen sword strike with card-surface fractures'
          git push origin HEAD:refs/heads/feat/skyfall-card-strike
