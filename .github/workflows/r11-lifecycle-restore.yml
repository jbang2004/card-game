name: Restore verified lifecycle R11 sources once
on:
  push:
    branches: [feat/full-vfx-remaster]
    paths: ['.github/r11-source/**', '.github/workflows/r11-lifecycle-restore.yml']
permissions:
  contents: write
jobs:
  restore:
    if: github.repository == 'jbang2004/card-game' && github.ref == 'refs/heads/feat/full-vfx-remaster'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify source baseline and restore the tested delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 58d604a894ec818e4b4b7c5f552dd987981e192b
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zlib
          expected = {'config/build.json', 'docs/design/STATE_LIFECYCLE_R11.md', 'src/effects.js', 'src/presentation/fx-stage.js', 'src/presentation/lifecycle-feedback.js', 'src/presentation/skins/slate/lifecycle.css', 'src/template.html', 'src/vfx3/lifecycle-arts.js', 'src/vfx3/runtime.js', 'tests/lifecycle-r11.test.cjs', 'tests/vfx3-flow.test.cjs', 'tests/vfx3-refinement.test.cjs', 'tools/vfx3/assemble_lifecycle.py', 'tools/vfx3/export_demo.py', 'tools/vfx3/lab.js', 'tools/vfx3/lifecycle-fixtures.js', 'tools/vfx3/lifecycle-lab.js', 'tools/vfx3/record_lifecycle.py', 'tools/vfx3/replay-state.js', 'tools/vfx3/verify_lifecycle.py'}
          encoded = ''.join(Path('.github/r11-source/part-%d.b64' % i).read_text() for i in range(35))
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'd296321027db464d7553127c86fe86abf22c40661dfbe20bdae3b546b053d62f', 'source transport checksum mismatch'
          delta = json.loads(raw)
          assert set(delta) == expected, 'unexpected changed file scope'
          outputs = {}
          for name, change in delta.items():
              path = Path(name)
              before = path.read_bytes() if path.exists() else b''
              digest = hashlib.sha256(before).hexdigest() if path.exists() else None
              assert digest == change['before'], 'baseline mismatch: ' + name
              lines = before.decode('utf-8').splitlines(keepends=True)
              text = ''.join(part if isinstance(part, str) else ''.join(lines[part[0]:part[1]]) for part in change['parts'])
              data = text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == change['after'], 'output mismatch: ' + name
              outputs[path] = data
          for path, data in outputs.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print('Verified and restored', len(outputs), 'files; approved flame, benchmarks, renderer and rules untouched.')
          PY
      - name: Build both game entries and test all Node suites
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py
          python3 tools/vfx3/export_demo.py
          node --test tests/*.test.cjs | tee /tmp/lifecycle-r11-tests.log
      - name: Commit implementation and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .github/r11-source .github/workflows/r11-lifecycle-restore.yml
          git add config/build.json docs/design/STATE_LIFECYCLE_R11.md src/effects.js src/presentation/fx-stage.js src/presentation/lifecycle-feedback.js src/presentation/skins/slate/lifecycle.css src/template.html src/vfx3/lifecycle-arts.js src/vfx3/runtime.js tests/lifecycle-r11.test.cjs tests/vfx3-flow.test.cjs tests/vfx3-refinement.test.cjs tools/vfx3/assemble_lifecycle.py tools/vfx3/export_demo.py tools/vfx3/lab.js tools/vfx3/lifecycle-fixtures.js tools/vfx3/lifecycle-lab.js tools/vfx3/record_lifecycle.py tools/vfx3/replay-state.js tools/vfx3/verify_lifecycle.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: R11 lifecycle cues for states, special events and battle outcomes'
          git push origin HEAD:refs/heads/feat/full-vfx-remaster
