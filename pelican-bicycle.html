<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕的海边骑行</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f6f1e7;color:#284e51;font-family:ui-rounded,'PingFang SC',sans-serif}.postcard{width:min(1100px,95vw);position:relative}header{padding:24px 5% 0;display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(22px,4vw,38px);font-weight:500;letter-spacing:.12em;margin:8px 0}small{font-size:11px;letter-spacing:.3em;color:#7b9290}svg{display:block;width:100%;height:auto}footer{display:flex;justify-content:space-between;align-items:center;padding:0 5% 26px;font-size:12px;letter-spacing:.12em;color:#7b9290}button{background:transparent;border:1px solid #9bb0a8;color:#355c58;border-radius:30px;padding:10px 20px;cursor:pointer}button:hover{background:#e4ece2}button:focus-visible{outline:3px solid #e59b52;outline-offset:4px}
</style>
</head>
<body><main class="postcard"><header><div><small>THE SLOW COAST CLUB · 001</small><h1>今天，顺风。</h1></div><small>海边骑行日记</small></header>
<svg viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">鹈鹕骑自行车的二维动画</title><desc id="desc">一只戴绿色围巾的白色鹈鹕，踩着红色自行车沿海岸骑行，远处是太阳、海水和缓缓飘动的云。</desc>
<defs><clipPath id="scene"><rect x="30" y="20" width="940" height="580" rx="160"/></clipPath><g id="cloud" fill="#fffcf2"><path d="M0 25 Q-10 4 15 4 Q22-20 45-8 Q65-18 73 4 Q104 3 105 25Z"/></g><g id="spokes" stroke="#8bafac" stroke-width="2"><path d="M-76 0H76M0-76V76M-54-54L54 54M-54 54L54-54M-70-29L70 29M-29-70L29 70M-70 29L70-29M-29 70L29-70"/></g></defs>
<g clip-path="url(#scene)"><path fill="#dcece5" d="M30 20H970V600H30Z"/><circle cx="760" cy="136" r="56" fill="#f3c975"/><circle cx="760" cy="136" r="72" fill="none" stroke="#f3c975" opacity=".22"/>
<g id="clouds"><use href="#cloud" x="150" y="141"/><use href="#cloud" x="487" y="87" transform="translate(120 25) scale(.8)"/><use href="#cloud" x="889" y="205"/></g>
<path d="M30 340 Q160 295 295 327T560 323T970 313V490H30Z" fill="#b5d3c7"/><path d="M30 371 Q200 350 380 370T970 351V500H30Z" fill="#81b9b5"/><g fill="none" stroke="#d2e5d8" stroke-width="3" stroke-linecap="round"><path d="M75 393h95m49 14h53m406-23h101m-16 39h68M364 393h65"/></g>
<path d="M30 470Q370 425 970 470V660H30Z" fill="#e9dabb"/><path d="M30 521Q450 496 970 521" fill="none" stroke="#f9f1db" stroke-width="5"/>
<g id="road" stroke="#c5b48e" stroke-width="3" stroke-linecap="round"><path d="M70 565h34m116-23h17m130 37h42m145-29h25m151 18h36m130-26h29M1030 565h34m116-23h17m130 37h42m145-29h25m151 18h36"/></g>
<ellipse cx="499" cy="544" rx="237" ry="16" fill="#b7a787" opacity=".23"/>
<g id="rider" stroke="#294e53" stroke-linecap="round" stroke-linejoin="round">
<!-- wheels -->
<g transform="translate(337 448)"><circle r="89" fill="#f8f2df" stroke-width="10"/><circle r="78" fill="#e0e5d6" stroke="#f8f2df" stroke-width="4"/><g id="rearWheel"><use href="#spokes"/></g><circle r="8" fill="#e7b36b" stroke-width="3"/></g>
<g transform="translate(678 448)"><circle r="89" fill="#f8f2df" stroke-width="10"/><circle r="78" fill="#e0e5d6" stroke="#f8f2df" stroke-width="4"/><g id="frontWheel"><use href="#spokes"/></g><circle r="8" fill="#e7b36b" stroke-width="3"/></g>
<path id="farLeg" d="M471 303L488 365L518 437" fill="none" stroke="#c18e48" stroke-width="12"/>
<!-- frame -->
<path d="M337 448L424 330L489 448H337L612 329L489 448M424 330H612M600 298L678 448" fill="none" stroke="#294e53" stroke-width="13"/><path d="M337 448L424 330L489 448H337L612 329L489 448M424 330H612M600 298L678 448" fill="none" stroke="#d87560" stroke-width="8"/>
<path d="M424 330L414 306M600 298L589 267Q588 260 600 259L636 258" fill="none" stroke-width="8"/><path d="M390 305H443" stroke-width="13"/><path d="M622 258H641" stroke="#b58155" stroke-width="12"/>
<circle cx="489" cy="448" r="22" fill="#e8c68c" stroke-width="4"/><g id="crank"><path d="M459 448H519" stroke-width="5"/><circle cx="489" cy="448" r="5" fill="#294e53"/></g>
<!-- tail and body -->
<path d="M398 285Q353 288 330 254L385 263L350 233Q404 234 437 264" fill="#f8f5e8" stroke-width="4"/>
<path d="M399 241C418 216 481 230 501 211C515 198 499 151 521 135C543 116 572 136 566 161C560 184 548 195 556 224C570 273 532 317 472 319C423 321 381 292 399 241Z" fill="#fffbee" stroke-width="4"/>
<path d="M408 262Q445 247 490 277Q459 307 422 286" fill="#e4e8da" stroke-width="3"/><path d="M423 272l30 10m-20-17l31 11" fill="none" stroke="#bdcfc5" stroke-width="3"/>
<!-- head and generous pelican pouch -->
<path d="M552 157L700 173Q674 220 605 208Q567 200 552 172Z" fill="#ecc079" stroke-width="4"/><path d="M558 152L710 171Q716 174 706 178L554 173" fill="#f0a751" stroke-width="4"/><path d="M575 181Q617 201 663 187" fill="none" stroke="#d6a55f" stroke-width="2"/>
<circle cx="547" cy="147" r="5" fill="#294e53" stroke="none"/><circle cx="548.5" cy="145.5" r="1.4" fill="white" stroke="none"/><path d="M534 132q8-7 15-2" fill="none" stroke-width="3"/>
<path d="M520 130q-9-16-4-22m11 20q-2-16 5-20" fill="none" stroke-width="3"/>
<!-- scarf -->
<path id="scarf" d="M526 199Q479 195 461 175L444 190Q477 218 529 213" fill="#548e7a" stroke-width="3"/><path d="M516 198Q535 211 553 196L557 211Q537 226 517 213Z" fill="#75a18a" stroke-width="3"/>
<!-- wing on handlebar -->
<path d="M481 235Q504 254 537 256L611 255Q625 254 624 264Q576 280 534 274Q494 273 472 254" fill="#fffbee" stroke-width="4"/>
<path id="nearLeg" d="M472 309L451 371L459 448" fill="none" stroke="#e8ad57" stroke-width="13"/><path id="foot" d="M451 447Q468 439 480 449L487 456H448Z" fill="#efb762" stroke-width="3"/>
</g>
<g fill="none" stroke="#688d85" stroke-width="3" stroke-linecap="round"><path d="M338 136q9-10 18 0q9-10 18 0M393 113q6-7 12 0q6-7 12 0"/></g>
<g stroke="#78977c" stroke-width="4" fill="none" stroke-linecap="round"><path d="M95 517q4-36-13-51m13 51q9-30 26-37M875 538q-5-38 11-58m-11 58q-19-30-33-32"/></g>
</g></svg>
<footer><span>不赶路，只追海风。</span><button id="toggle" type="button" aria-label="暂停动画">暂停骑行 ⏸</button></footer></main>
<script>
const el=id=>document.getElementById(id);let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,t=0,last=null;const button=el('toggle');function label(){button.textContent=playing?'暂停骑行 ⏸':'继续骑行 ▶';button.setAttribute('aria-label',playing?'暂停动画':'播放动画')}button.onclick=()=>{playing=!playing;label()};label();
function draw(){const a=t*3.7,x=489+30*Math.cos(a),y=448+30*Math.sin(a),fx=489-30*Math.cos(a),fy=448-30*Math.sin(a);el('rearWheel').setAttribute('transform',`rotate(${t*180})`);el('frontWheel').setAttribute('transform',`rotate(${t*180})`);el('crank').setAttribute('transform',`rotate(${a*180/Math.PI} 489 448)`);el('nearLeg').setAttribute('d',`M472 309 Q${428+12*Math.cos(a)} 369 ${x} ${y}`);el('farLeg').setAttribute('d',`M480 307 Q${520-12*Math.cos(a)} 365 ${fx} ${fy}`);el('foot').setAttribute('d',`M${x-8} ${y-3} Q${x+9} ${y-11} ${x+21} ${y+1}L${x+26} ${y+7}H${x-11}Z`);el('rider').setAttribute('transform',`translate(0 ${Math.sin(a*2)*1.6})`);el('scarf').setAttribute('d',`M526 199Q479 ${195+Math.sin(a)*5} 461 ${175+Math.sin(a+1)*8}L444 ${190+Math.sin(a+1)*8}Q477 218 529 213`);el('road').setAttribute('transform',`translate(${-t*110%960} 0)`);el('clouds').setAttribute('transform',`translate(${-45*Math.sin(t*.09)} 0)`)}function tick(now){if(last!==null&&playing)t+=Math.min((now-last)/1000,.05);last=now;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
