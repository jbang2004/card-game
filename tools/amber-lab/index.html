<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>琥珀手牌实验室</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <img id="backdrop" src="backdrop.webp" alt="" draggable="false">
    <nav id="tabs" class="glass">
      <button data-view="battle" class="on">战场手牌</button>
      <button data-view="tray">鉴珀图谱</button>
    </nav>

    <section id="battle" class="view on">
      <div id="enemy-stones" aria-label="敌方手牌"></div>
      <div id="case" title="琥珀匣（牌库）"><i></i><span id="case-count">26</span></div>
      <svg id="strap" viewBox="0 0 1600 940" aria-hidden="true"></svg>
      <div id="hand"></div>
      <div id="awaken-layer"></div>
      <aside id="controls" class="glass">
        <h2>琥珀手牌 · 实验</h2>
        <label>火种之温（法力）<output id="mana-out">6</output>
          <input id="mana" type="range" min="0" max="10" value="6"></label>
        <div class="row">
          <button id="turn">新回合：焐热</button>
          <button id="draw">抽一块：开窗</button>
        </div>
        <div class="row">
          <button id="enemy-kind">敌方：联邦原石</button>
          <button id="strap-toggle">皮带：开</button>
        </div>
        <p class="hint">悬停琥珀：拿起、焐热、看见里面的生命。点击：唤醒（出牌）。</p>
      </aside>
    </section>

    <section id="tray" class="view">
      <header>
        <h1>鉴珀图谱</h1>
        <p>每张牌都是一块封着远古生命的琥珀。颜色说职业，切工与镶嵌说稀有度，外形说类型，光说能不能出。</p>
      </header>
      <div id="tray-groups"></div>
    </section>
  </div>
</div>
<script src="amber.js"></script>
<script src="lab.js"></script>
</body>
</html>
