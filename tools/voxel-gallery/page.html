<title>体素角色馆</title>
<meta name="description" content="风起之境战场上的体素角色：旋转查看、逐个播放动作、两两对战看打击感。">
<style>
  /* One deliberate dark look — the battlefield at dusk: obsidian glass, ember for what you can press, brass for
   * labels, crimson for the lethal blows. Colours match the game's arena tokens (skins/slate/base.css). */
  :root {
    color-scheme: dark;
    --ground: #0d0b09;
    --glass: rgba(26, 21, 17, 0.8);
    --glass-2: rgba(255, 255, 255, 0.055);
    --rim: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    --ink: #f6efe2;
    --ink-2: #cdbfa6;
    --ink-3: #8f8471;
    --ember: #ff9b3d;
    --ember-hi: #ffd39a;
    --ember-lo: #b4471a;
    --brass: #c9a45c;
    --crimson: #e0475a;
    /* system faces only, like the game: a web-font request must never hold the page (Google Fonts is often out of
       reach where this is played) */
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    --gutter: 20px;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--sans); overflow: hidden; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--ember-hi); outline-offset: 2px; }
  #app { position: relative; height: 100%; overflow: hidden; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  .glass { background: var(--glass); box-shadow: var(--rim), 0 18px 50px rgba(0, 0, 0, 0.45); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border-radius: 18px; }

  /* title + views */
  .top { position: absolute; left: var(--gutter); top: 18px; display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; pointer-events: none; }
  .brand { display: flex; flex-direction: column; gap: 2px; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }
  .eyebrow { font-size: 12px; letter-spacing: 0.28em; color: var(--brass); font-weight: 500; }
  h1 { margin: 0; font: 900 32px/1.1 var(--serif); letter-spacing: 0.06em; color: var(--ink); }
  .views { pointer-events: auto; display: flex; gap: 4px; padding: 4px; }
  .views button { border: 0; background: transparent; padding: 7px 16px; border-radius: 12px; color: var(--ink-2); cursor: pointer; font-weight: 500; }
  .views button[aria-pressed="true"] { background: var(--ember); color: #1c0f05; font-weight: 700; }
  .views button:not([aria-pressed="true"]):hover { background: var(--glass-2); color: var(--ink); }

  .panel { display: contents; }

  /* roster */
  #roster { position: absolute; left: var(--gutter); top: 118px; bottom: 104px; width: 236px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
  .shelf { display: flex; flex-direction: column; gap: 4px; }
  .shelf-name { font-size: 12px; letter-spacing: 0.18em; color: var(--brass); padding: 2px 10px 4px; }
  .who { position: relative; border: 0; text-align: left; background: transparent; padding: 8px 10px; border-radius: 12px; cursor: pointer; display: grid; gap: 1px; }
  .who:hover { background: var(--glass-2); }
  .who[aria-pressed="true"] { background: rgba(255, 155, 61, 0.14); box-shadow: inset 0 0 0 1px rgba(255, 155, 61, 0.45); }
  .who-name { font-weight: 700; font-size: 15px; color: var(--ink); }
  .who-note { font-size: 12px; color: var(--ink-3); }
  .slot { position: absolute; right: 10px; top: 50%; translate: 0 -50%; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .slot.a { background: var(--ember); color: #1c0f05; }
  .slot.b { background: var(--crimson); color: #fff; }

  /* the selected figure(s) */
  #info { position: absolute; right: var(--gutter); top: 18px; width: 272px; display: flex; flex-direction: column; gap: 10px; }
  .card { padding: 14px 16px 12px; }
  .role { font-size: 12px; letter-spacing: 0.2em; color: var(--brass); }
  .name { font: 900 26px/1.2 var(--serif); letter-spacing: 0.04em; margin-top: 2px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; color: var(--ink-2); font-size: 12.5px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--ink-3); }
  .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0 0; }
  .nums div { background: var(--glass-2); border-radius: 10px; padding: 6px 8px; }
  .nums dt { font-size: 11px; color: var(--ink-3); }
  .nums dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .baking { margin-top: 10px; color: var(--ember-hi); font-size: 13px; }

  /* actions */
  .dock { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; display: flex; align-items: center; gap: 10px; padding: 8px; max-width: calc(100% - 2 * var(--gutter)); }
  #actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .act { border: 0; cursor: pointer; padding: 9px 16px; border-radius: 999px; background: var(--glass-2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); color: var(--ink); font-weight: 500; }
  .act:hover { background: rgba(255, 155, 61, 0.2); }
  .act:active { background: var(--ember); color: #1c0f05; }
  .act.lethal { color: #ffd0d6; }
  .act.lethal:hover { background: rgba(224, 71, 90, 0.28); }
  .act.quiet[aria-pressed="true"] { box-shadow: inset 0 0 0 1px rgba(255, 155, 61, 0.55); color: var(--ember-hi); }
  .hint { color: var(--ink-3); font-size: 13px; padding: 0 10px; }
  .slot-pick { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 13px; padding-left: 6px; }
  .slotbtn { border: 0; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; background: var(--glass-2); font-weight: 700; }
  .slotbtn[data-slot="a"][aria-pressed="true"] { background: var(--ember); color: #1c0f05; }
  .slotbtn[data-slot="b"][aria-pressed="true"] { background: var(--crimson); color: #fff; }
  #sound { border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: transparent; color: var(--ink-2); white-space: nowrap; }
  #sound::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  #sound[aria-pressed="true"] { color: var(--ember-hi); }
  #sound[aria-pressed="true"]::before { background: var(--ember); box-shadow: 0 0 10px var(--ember); }

  /* name tags under the figures (all-figures view) */
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .tag { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; cursor: pointer; padding: 3px 10px; border-radius: 999px; background: rgba(13, 11, 9, 0.62); color: var(--ink); font-size: 12.5px; font-weight: 500; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .tag:hover { background: var(--ember); color: #1c0f05; }

  /* phones: the stage keeps the top; the selected figure, the roster strip and the actions stack at the bottom */
  @media (max-width: 760px) {
    :root { --gutter: 16px; }
    h1 { font-size: 24px; }
    .top { top: 12px; gap: 12px; }
    .views button { padding: 6px 12px; }
    .panel { display: flex; flex-direction: column; gap: 8px; position: absolute; left: var(--gutter); right: var(--gutter); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    .panel > #info, .panel > #roster, .panel > .dock { position: static; inset: auto; translate: none; width: auto; max-width: none; }
    #info { flex-direction: row; gap: 8px; }
    #info .card { flex: 1 1 0; min-width: 0; padding: 8px 12px; }
    .name { font-size: 18px; }
    .nums, .meta .mono { display: none; }
    #roster { height: 64px; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 6px; gap: 8px; }
    .shelf { flex-direction: row; align-items: stretch; gap: 4px; }
    .shelf-name { display: none; }
    .who { min-width: 112px; padding: 6px 10px; }
    .who-note { display: none; }
    .dock { flex-wrap: wrap; justify-content: center; }
    .act { padding: 8px 13px; }
    .hint { display: none; }
    #labels { display: none; }                          /* the roster strip names them; tap a figure to open it */
  }
  @media (max-width: 760px) and (max-height: 680px) { #info { display: none; } }
  @media (prefers-reduced-motion: reduce) { .views button, .act, .who { transition: none; } }
</style>
<div id="app">
  <canvas id="stage" aria-label="体素角色舞台：拖动旋转，滚轮缩放"></canvas>
  <div id="labels"></div>
  <div class="top">
    <div class="brand"><span class="eyebrow">风起之境 · 战场角色</span><h1>体素角色馆</h1></div>
    <div class="views glass" role="group" aria-label="视图">
      <button type="button" data-mode="all" aria-pressed="true">全员</button>
      <button type="button" data-mode="solo" aria-pressed="false">单人</button>
      <button type="button" data-mode="duel" aria-pressed="false">对战</button>
    </div>
  </div>
  <div class="panel">
    <section id="info" aria-live="polite"></section>
    <nav id="roster" class="glass" aria-label="角色名册"></nav>
    <div class="dock glass">
      <div id="actions"></div>
      <button id="sound" type="button" aria-pressed="false"><span>声音 关</span></button>
    </div>
  </div>
</div>
